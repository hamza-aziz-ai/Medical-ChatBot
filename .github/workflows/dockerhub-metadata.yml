name: dockerhub-metadata

# Keeps the Docker Hub repositories' descriptions, overview and immutable version tags matching
# docs/dockerhub/ (D-031). Merges by automerge start no push workflows, but workflow_run still fires;
# a run with nothing to change only reads Docker Hub.
on:
  workflow_run:
    workflows: [automerge]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-metadata
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
      - name: Make Docker Hub match docs/dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 scripts/dockerhub_metadata.py
