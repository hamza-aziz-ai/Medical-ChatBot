name: autorelease

# One release per merge (D-019). scripts/next_release.py picks the oldest merge on main, after the last
# published release, that changed shipped files, and its version (patch, or its pull request's
# release:minor / release:major label, or the `bump` input). release.yml runs every gate at that commit and
# creates the tag only after they pass. After a successful release this workflow starts itself again for
# the next merge; the chain ends when every shippable merge is released, and stops on any failure.
on:
  # Merges by automerge use the workflow token and start no push workflows, but workflow_run still fires.
  workflow_run:
    workflows: [automerge]
    types: [completed]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump for this run's release; auto reads its pull request's release:minor / release:major label
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: read

# A running release is never cancelled. A newer waiting run may replace an older waiting one,
# which is safe because every run plans from the published state of main.
concurrency:
  group: autorelease
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Draft releases are listed only to tokens with write access.
      contents: write
      packages: read
      pull-requests: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # v1.1.0 releases everything merged before per-merge releases began; never drain that backlog one by one.
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump || 'auto' }}
        run: |
          python3 scripts/next_release.py --repo "$GITHUB_REPOSITORY" \
            --image-prefix "ghcr.io/${GITHUB_REPOSITORY_OWNER}/medical-chatbot" --bump "$BUMP" \
            --require-baseline v1.1.0 >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      sha: ${{ needs.plan.outputs.sha }}
    permissions:
      contents: write
      packages: write

  # Only after a successful release: start the next run, which releases the next merge or finds none.
  # workflow_dispatch is one of the events the workflow token may start.
  continue:
    needs: release
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: gh workflow run autorelease.yml --ref main -f bump=auto
