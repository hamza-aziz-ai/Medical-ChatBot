name: mlops

# Knowledge-graph lifecycle: data gates, live Neo4j integration, import and evaluation.
# Runs only when the data, the importer, the code that answers questions or the evaluation changes.
on:
  pull_request:
    paths: &mlops-paths
      - "api/build_medicalgraph.py"
      - "api/terms.py"
      - "api/question_classifier.py"
      - "api/question_parser.py"
      - "api/answer_searcher.py"
      - "api/chatbot_graph_logic.py"
      - "api/database.py"
      - "api/app_logging.py"
      - "api/data/medical.csv"
      - "api/dictionary/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "scripts/evaluate_kg.py"
      - "eval/**"
      - "tests/test_live_neo4j.py"
      - "tests/test_importer.py"
      - "tests/test_evaluate_kg.py"
      - "tests/conftest.py"
      - ".github/workflows/mlops.yml"
  push:
    branches: [main]
    paths: *mlops-paths
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-mlops-${{ inputs.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  graph:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        neo4j: ["5", "4.4"]
    services:
      neo4j:
        image: neo4j:${{ matrix.neo4j }}
        env:
          # Throwaway credential for this ephemeral test container only.
          NEO4J_AUTH: neo4j/ci-test-password
        ports:
          - 7687:7687
    env:
      NEO4J_TEST_URI: neo4j://localhost:7687
      NEO4J_URI: neo4j://localhost:7687
      NEO4J_PASSWORD: ci-test-password
      NEO4J_TEST_ALLOW_WIPE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Data gates
        run: python -m pytest tests/test_importer.py tests/test_evaluate_kg.py
      - name: Wait for Neo4j
        run: |
          python - <<'EOF'
          import time
          from neo4j import GraphDatabase
          for attempt in range(60):
              try:
                  with GraphDatabase.driver("neo4j://localhost:7687", auth=("neo4j", "ci-test-password")) as driver:
                      driver.verify_connectivity()
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("Neo4j did not become ready")
          EOF
      - name: Live Neo4j tests (must run, not skip)
        run: python -m pytest tests/test_live_neo4j.py -v -s -rs | tee live.log; test "${PIPESTATUS[0]}" -eq 0 && ! grep -q SKIPPED live.log
      - name: Import the shipped dataset
        if: matrix.neo4j == '5'
        working-directory: api
        run: python build_medicalgraph.py
      - name: Evaluate against the reviewed baseline
        if: matrix.neo4j == '5'
        run: |
          status=0
          python scripts/evaluate_kg.py eval-report.json > /dev/null || status=$?
          { echo '### Knowledge-graph evaluation'; echo '```json'; cat eval-report.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.neo4j == '5' && always()
        with:
          name: eval-report
          path: eval-report.json
          if-no-files-found: ignore
