name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24"]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test
      - run: yarn build

  live-neo4j:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        neo4j: ["5", "4.4"]
    services:
      neo4j:
        image: neo4j:${{ matrix.neo4j }}
        env:
          # Throwaway credential for this ephemeral test container only.
          NEO4J_AUTH: neo4j/ci-test-password
        ports:
          - 7687:7687
    env:
      NEO4J_TEST_URI: neo4j://localhost:7687
      NEO4J_PASSWORD: ci-test-password
      NEO4J_TEST_ALLOW_WIPE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - name: Wait for Neo4j
        run: |
          python - <<'EOF'
          import time
          from neo4j import GraphDatabase
          for attempt in range(60):
              try:
                  with GraphDatabase.driver("neo4j://localhost:7687", auth=("neo4j", "ci-test-password")) as driver:
                      driver.verify_connectivity()
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("Neo4j did not become ready")
          EOF
      - name: Live Neo4j tests (must run, not skip)
        run: python -m pytest tests/test_live_neo4j.py -v -s -rs | tee live.log; test ${PIPESTATUS[0]} -eq 0 && ! grep -q SKIPPED live.log
