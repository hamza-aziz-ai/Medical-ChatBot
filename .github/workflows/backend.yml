name: backend

# Offline Python tests. Live Neo4j tests run in mlops.yml.
on:
  pull_request:
    paths: &backend-paths
      - "api/**"
      - "tests/**"
      - "notebooks/**"
      - "scripts/evaluate_kg.py"
      - "scripts/next_release.py"
      - "scripts/update_stack.py"
      - "scripts/dataset_pilot.py"
      - "scripts/rollback_drill.py"
      - ".github/workflows/release.yml"
      - ".github/workflows/autorelease.yml"
      - "eval/**"
      - "requirements*.txt"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths: *backend-paths
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-backend-${{ inputs.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests
