# Request lines carry the user's question (/api/?search=...), and nginx copies them into its
# access log and appends them to error messages at every severity. Both logs are therefore
# discarded. Do not add error_log or access_log anywhere below; to debug locally, temporarily
# use "error_log stderr warn;" here and never publish that image.
error_log /dev/null;
pid /tmp/nginx.pid;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    log_not_found off;
    server_tokens off;
    sendfile on;

    # The API has no authentication (D-013), so flooding is limited here: 10 questions per second
    # per client with bursts of 20; anything beyond gets 429, which the page explains.
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_status 429;
    # And at most 16 API requests in flight from everyone together, so many addresses cannot queue
    # unbounded work behind the single API worker (D-032).
    limit_conn_zone $server_name zone=api_all:1m;
    limit_conn_status 429;

    # Trusted-proxy settings for a hosted deployment only (D-032). The image installs nothing here, so
    # no client-sent address header is ever trusted; the hosted compose adds one file naming its tunnel.
    include /etc/nginx/realip.d/*.conf;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        root /usr/share/nginx/html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            limit_conn api_all 16;
            # The trailing slash strips the /api prefix before the request reaches Flask.
            proxy_pass http://api:5000/;
            proxy_set_header Host $host;
            # Overwrites any client-sent value; the API's suggestion budget keys on it (D-025).
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            # no-store also on nginx's own 429/502/504 for /api/ (D-029). A location-level add_header stops the
            # server-level ones from being inherited, so the three security headers are repeated here unchanged.
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
        }

        # The app is one page with no client-side routes, so an unknown path is a real 404 with the site's own page
        # (D-035), not the app answering 200 at every address.
        error_page 404 /404.html;

        location = /404.html {
            internal;
        }

        location = / {
        }

        # The page is revalidated on every load, so a reload always gets the current release (D-037). / ends here
        # through the index module's internal redirect. The security headers are repeated for the reason given above.
        location = /index.html {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
        }

        location / {
            try_files $uri =404;
        }
    }
}
