# Local stack: Neo4j, the API and the web frontend. Secrets come from .env (see .env.example).
#   First run:  docker compose up -d --wait neo4j && docker compose --profile init run --rm importer
#   Then:       docker compose up -d
# The importer replaces the graph snapshot, so it only runs when asked for (profile "init").
name: medical-chatbot

x-api: &api
  image: ${API_IMAGE:-medical-chatbot-api:local}
  build:
    context: .
    dockerfile: docker/api.Dockerfile
  environment: &api-env
    NEO4J_URI: neo4j://neo4j:7687
    NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
  depends_on:
    neo4j:
      condition: service_healthy

services:
  neo4j:
    image: neo4j:5.26@sha256:adaa077a3ab023015143b8f73f7076a7d053f12985f5b06f4c6a128c3a2f7240
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  importer:
    <<: *api
    profiles: [init]
    command: ["python", "build_medicalgraph.py"]

  api:
    <<: *api
    environment:
      <<: *api-env
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # D-027: on by default here; the owner's Ollama relays gpt-oss:120b-cloud. Set LLM_UNDERSTANDING=off to use the rules only.
      LLM_UNDERSTANDING: ${LLM_UNDERSTANDING:-on}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL:-gpt-oss:120b-cloud}
    volumes:
      - api-logs:/app/logs
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:-medical-chatbot-web:local}
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  neo4j-data:
  api-logs:
